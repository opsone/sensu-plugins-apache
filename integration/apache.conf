ServerName localhost
LoadModule cgid_module modules/mod_cgid.so

# 20 workers: ServerLimit x ThreadsPerChild = MaxRequestWorkers, all started at boot.
<IfModule mpm_event_module>
    StartServers 4
    ServerLimit 4
    ThreadsPerChild 5
    MaxRequestWorkers 20
    MinSpareThreads 5
    MaxSpareThreads 20
</IfModule>

ExtendedStatus On
<Location /apache-status>
    SetHandler server-status
</Location>
<Location /denied-status>
    SetHandler server-status
    Require all denied
</Location>
Redirect permanent /old-status /apache-status
